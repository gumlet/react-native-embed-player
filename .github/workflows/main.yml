name: Deploy
on:
  push:
    tags:
    - "*"

jobs:
  publish-npm:
    permissions:
      id-token: write
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          package-manager-cache: false
          node-version: 24
          registry-url: https://registry.npmjs.org/
      - run: npm i
      - run: npm publish --provenance
